<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 ANT CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>

  <body class="ant-config">
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label style="position: relative; top: 20px" class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div class="container1">
        <h1>ANT CONFIG</h1>
      </div>

      <div class="container1">
        <form id="ant-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th></th>
                  <th>ANT</th>
                  <th>POWER</th>
                  <th>RSSI</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <label>1</label>
                  </td>
                  <td>
                    <label class="checkbox">
                      <input type="checkbox" name="ANT_1_CHECK" />
                      <span class="checkmark"></span>
                    </label>
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_1_POWER"
                    />
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_1_RSSI"
                    />
                  </td>
                </tr>

                <tr>
                  <td>
                    <label>2</label>
                  </td>
                  <td>
                    <label class="checkbox">
                      <input type="checkbox" name="ANT_2_CHECK" />
                      <span class="checkmark"></span>
                    </label>
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_2_POWER"
                    />
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_2_RSSI"
                    />
                  </td>
                </tr>

                <tr>
                  <td>
                    <label>3</label>
                  </td>
                  <td>
                    <label class="checkbox">
                      <input type="checkbox" name="ANT_3_CHECK" />
                      <span class="checkmark"></span>
                    </label>
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_3_POWER"
                    />
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_3_RSSI"
                    />
                  </td>
                </tr>

                <tr>
                  <td>
                    <label>4</label>
                  </td>
                  <td>
                    <label class="checkbox">
                      <input type="checkbox" name="ANT_4_CHECK" />
                      <span class="checkmark"></span>
                    </label>
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_4_POWER"
                    />
                  </td>
                  <td>
                    <input
                      class="placeholder_style ant-input"
                      type="number"
                      name="ANT_4_RSSI"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="container1">
            <button class="bt_style" type="submit">SET CONFIG</button>
          </div>
        </form>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <button onclick="window.location.href = '/reader'">READER</button>
      </div>

      <div class="container1">
        <h1>CURRENT CONFIG</h1>
      </div>

      <div class="container1">
        <table class="table_2" id="dataTable">
          <thead>
            <tr>
              <th>ANT</th>
              <th>CHECK</th>
              <th>POWER</th>
              <th>RSSI</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function getPayload() {
      const antennas = [];
      for (let i = 1; i <= 4; i += 1) {
        antennas.push({
          id: i,
          active: document.querySelector(`[name="ANT_${i}_CHECK"]`).checked,
          power: Number(
            document.querySelector(`[name="ANT_${i}_POWER"]`).value || 0,
          ),
          rssi: Number(
            document.querySelector(`[name="ANT_${i}_RSSI"]`).value || 0,
          ),
        });
      }
      return { antennas };
    }

    async function loadConfig() {
      fetch("/api/v1/antenna/config")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || [];
          data.forEach((ant) => {
            const id = ant.id;
            const check = document.querySelector(`[name="ANT_${id}_CHECK"]`);
            const power = document.querySelector(`[name="ANT_${id}_POWER"]`);
            const rssi = document.querySelector(`[name="ANT_${id}_RSSI"]`);
            if (check) check.checked = !!ant.active;
            if (power) power.value = ant.power;
            if (rssi) rssi.value = ant.rssi;
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }

    document
      .getElementById("ant-config-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          const response = await fetch("/api/v1/antenna/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(getPayload()),
          });
          const json = await response.json();
          if (!response.ok || json.status !== "ok") {
            throw new Error(json.message || "falha ao salvar");
          }
          setStatus("Configuração salva com sucesso.", false);
          att_table();
        } catch (error) {
          setStatus("Erro ao salvar configuração: " + error, true);
        }
      });

    function update_html() {
      att_table();
    }
    loadConfig();
    update_html();
    setInterval(update_html, 1000);

    function att_table() {
      fetch("/api/v1/antenna/config")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || [];
          const tbody = document
            .getElementById("dataTable")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";
          data.forEach((ant) => {
            let tr = document.createElement("tr");
            [
              "A" + ant.id,
              ant.active ? "ON" : "OFF",
              ant.power,
              ant.rssi,
            ].forEach((cell) => {
              let td = document.createElement("td");
              td.textContent = String(cell);
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
  </script>
</html>
