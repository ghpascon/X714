<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 READER</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <style>
      #tags_table th {
        font-size: clamp(14px, 2vw, 24px);
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label style="position: relative; top: 20px" class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div class="container1">
        <h1>READER</h1>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <div class="container2">
          <button id="read_button" onclick="toggleReading()"></button>
        </div>
        <div class="container2">
          <button onclick="clearTags()">CLEAR</button>
        </div>
      </div>

      <div class="container1 reader-summary-row">
        <div class="container2">
          <div class="container_display">
            <label>Total:</label>
            <label id="total_lidas"></label>
          </div>
        </div>
        <div class="container2">
          <div class="reader-visual">
            <span id="reader-dot" class="reader-dot off"></span>
            <span id="reader-visual-text" class="reader-visual-text"
              >STATUS: OFF</span
            >
          </div>
        </div>
      </div>

      <div class="container1">
        <table class="table_tags" id="tags_table">
          <thead>
            <tr>
              <th id="total_tags"></th>
              <th>EPC</th>
              <th>TID</th>
              <th>ANT</th>
              <th>RSSI</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    async function toggleReading() {
      try {
        const response = await fetch("/api/v1/reader/toggle-reading", {
          method: "POST",
        });
        const json = await response.json();
        if (json.status !== "ok") throw new Error(json.message || "failed");
        get_reader_info();
      } catch (error) {
        setStatus("Falha ao alternar leitura: " + error, true);
      }
    }

    async function clearTags() {
      try {
        const response = await fetch("/api/v1/reader/clear-tags", {
          method: "POST",
        });
        const json = await response.json();
        if (json.status !== "ok") throw new Error(json.message || "failed");
        setStatus("Tags limpas com sucesso.", false);
        att_table();
        get_reader_info();
      } catch (error) {
        setStatus("Falha ao limpar tags: " + error, true);
      }
    }

    function update_html() {
      get_reader_info();
    }
    update_html();
    setInterval(update_html, 1000);

    function get_reader_info() {
      fetch("/api/v1/reader/state")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          document.getElementById("total_lidas").innerText =
            "TOTAL: " + String(data.total_tags || 0);
          document.getElementById("read_button").innerText =
            data.button_label || "READ";
          const button = document.getElementById("read_button");
          const buttonLabel = (data.button_label || "").toUpperCase();
          if (buttonLabel === "STOP") {
            button.style.backgroundColor = "#ef4444";
          } else if (buttonLabel === "READ") {
            button.style.backgroundColor = "#22c55e";
          } else {
            button.style.backgroundColor = "#a3a3a3";
          }
          document.getElementById("read_button").disabled =
            data.button_enabled === false;

          const visualDot = document.getElementById("reader-dot");
          const visualText = document.getElementById("reader-visual-text");
          visualDot.classList.remove("on", "off", "locked");
          if (buttonLabel === "STOP") {
            visualDot.classList.add("on");
            visualText.textContent = "STATUS: READING";
          } else if (buttonLabel === "READ") {
            visualDot.classList.add("off");
            visualText.textContent = "STATUS: READY";
          } else {
            visualDot.classList.add("locked");
            visualText.textContent = "STATUS: GPI LOCKED";
          }
        })
        .catch((error) => console.error("Erro:", error));
    }

    function att_table() {
      const splitInHalf = (value) => {
        const text = String(value ?? "-");
        if (text.length <= 1) return text;
        const mid = Math.ceil(text.length / 2);
        return text.substring(0, mid) + "<br>" + text.substring(mid);
      };

      fetch("/api/v1/reader/tags")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || [];
          const tbody = document
            .getElementById("tags_table")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";
          data.forEach((row) => {
            let tr = document.createElement("tr");

            const rowCells = [
              String(row.index ?? "-"),
              splitInHalf(row.epc),
              splitInHalf(row.tid),
              String(row.antenna ?? "-"),
              String(row.rssi ?? "-"),
            ];

            rowCells.forEach((cell, index) => {
              const td = document.createElement("td");
              if (index === 1 || index === 2) {
                td.innerHTML = cell;
              } else {
                td.textContent = cell;
              }
              tr.appendChild(td);
            });

            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
    att_table();
    setInterval(att_table, 1000);
  </script>
</html>
