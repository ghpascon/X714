<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 WIFI CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>

  <body class="eth">
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center"
        class="container1"
      >
        <form id="wifi-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th><h1>PARAMETER</h1></th>
                  <th><h1>VALUE</h1></th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td><label>SSID:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="wifi_ssid"
                      id="wifi_ssid"
                    />
                  </td>
                </tr>

                <tr>
                  <td><label>PASSWORD:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="password"
                      name="wifi_password"
                      id="wifi_password"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="container1">
            <button class="bt_style" type="submit">SET CONFIG</button>
          </div>
        </form>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <h1>CURRENT CONFIG</h1>
      </div>

      <div class="container1">
        <table class="table_2" id="dataTable">
          <thead>
            <tr>
              <th>PARAMETER</th>
              <th>VALUE</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function loadConfig() {
      fetch("/api/v1/network/wifi")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          document.getElementById("wifi_ssid").value = data.wifi_ssid || "";
          document.getElementById("wifi_password").value =
            data.wifi_password || "";
        })
        .catch((error) => {
          console.error("Error fetching wifi config:", error);
        });
    }

    document
      .getElementById("wifi-config-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          const response = await fetch("/api/v1/network/wifi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              wifi_ssid: document.getElementById("wifi_ssid").value.trim(),
              wifi_password: document.getElementById("wifi_password").value,
            }),
          });

          const json = await response.json();
          if (!response.ok || json.status !== "ok") {
            throw new Error(json.message || "falha ao salvar");
          }
          setStatus("Configuração Wi-Fi salva.", false);
          update_elements();
        } catch (error) {
          setStatus("Erro ao salvar Wi-Fi: " + error, true);
        }
      });

    loadConfig();
    update_elements();
    setInterval(update_elements, 1000);

    function update_elements() {
      fetch("/api/v1/network/wifi")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          const tbody = document
            .getElementById("dataTable")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";

          const rows = [
            ["SSID", data.wifi_ssid || "-"],
            ["CONNECTION", data.connected ? "CONNECTED" : "DISCONNECTED"],
            ["CURRENT IP", data.current_ip || "-"],
          ];

          rows.forEach((row) => {
            let tr = document.createElement("tr");
            row.forEach((cell) => {
              let td = document.createElement("td");
              td.textContent = cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
  </script>
</html>
