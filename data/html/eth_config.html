<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 ETH CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>

  <body class="eth">
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center"
        class="container1"
      >
        <form id="eth-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th><h1>PARAMETER</h1></th>
                  <th><h1>VALUE</h1></th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <label>DHCP:</label>
                  </td>
                  <td>
                    <select
                      id="dhcp_on"
                      name="dhcp_on"
                      onchange="toggleIPFields()"
                    >
                      <option value="0">OFF</option>
                      <option value="1">ON</option>
                    </select>
                  </td>
                </tr>

                <tr class="ip-field">
                  <td><label>STATIC IP:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="static_ip"
                      id="static_ip"
                      pattern="^(\d{1,3}\.){3}\d{1,3}$"
                    />
                  </td>
                </tr>

                <tr class="ip-field">
                  <td><label>GATEWAY IP:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="gateway_ip"
                      id="gateway_ip"
                      pattern="^(\d{1,3}\.){3}\d{1,3}$"
                    />
                  </td>
                </tr>

                <tr class="ip-field">
                  <td><label>SUBNET MASK:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="subnet_mask"
                      id="subnet_mask"
                      pattern="^(\d{1,3}\.){3}\d{1,3}$"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="container1">
            <button class="bt_style" type="submit">SET CONFIG</button>
          </div>
        </form>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <h1>CURRENT CONFIG</h1>
      </div>

      <div class="container1">
        <table class="table_2" id="dataTable">
          <thead>
            <tr>
              <th>PARAMETER</th>
              <th>VALUE</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function toggleIPFields() {
      const dhcp = document.getElementById("dhcp_on").value === "1";
      const fields = document.getElementsByClassName("ip-field");
      for (let field of fields) {
        field.style.display = dhcp ? "none" : "table-row";
      }
    }

    function loadConfig() {
      fetch("/api/v1/network/ethernet")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          document.getElementById("dhcp_on").value = data.dhcp_on ? "1" : "0";
          document.getElementById("static_ip").value = data.static_ip || "";
          document.getElementById("gateway_ip").value = data.gateway_ip || "";
          document.getElementById("subnet_mask").value = data.subnet_mask || "";
          toggleIPFields();
        })
        .catch((error) => {
          console.error("Error fetching ethernet config:", error);
        });
    }

    document
      .getElementById("eth-config-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const payload = {
          dhcp_on: document.getElementById("dhcp_on").value === "1",
          static_ip: document.getElementById("static_ip").value.trim(),
          gateway_ip: document.getElementById("gateway_ip").value.trim(),
          subnet_mask: document.getElementById("subnet_mask").value.trim(),
        };

        try {
          const response = await fetch("/api/v1/network/ethernet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const json = await response.json();
          if (!response.ok || json.status !== "ok") {
            throw new Error(json.message || "falha ao salvar");
          }
          setStatus("Configuração Ethernet salva.", false);
          update_elements();
        } catch (error) {
          setStatus("Erro ao salvar Ethernet: " + error, true);
        }
      });

    loadConfig();
    update_elements();
    setInterval(update_elements, 1000);

    function update_elements() {
      fetch("/api/v1/network/ethernet")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          const tbody = document
            .getElementById("dataTable")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";

          const rows = [
            ["DHCP", data.dhcp_on ? "ON" : "OFF"],
            ["STATIC IP", data.static_ip || "-"],
            ["GATEWAY IP", data.gateway_ip || "-"],
            ["SUBNET MASK", data.subnet_mask || "-"],
            ["CONNECTION", data.connected ? "CONNECTED" : "DISCONNECTED"],
            ["CURRENT IP", data.current_ip || "-"],
          ];

          rows.forEach((row) => {
            let tr = document.createElement("tr");
            row.forEach((cell) => {
              let td = document.createElement("td");
              td.textContent = cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
  </script>
</html>
