<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 PREFIX CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>

  <body>
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label style="position: relative; top: 20px" class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center"
        class="container1"
      >
        <form id="prefix-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th><h1>PARAMETER</h1></th>
                  <th><h1>VALUE</h1></th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <label>PREFIX:</label>
                  </td>
                  <td>
                    <input
                      type="text"
                      class="placeholder_style"
                      name="prefix"
                      id="prefix"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="container1">
            <button type="submit">SAVE CONFIG</button>
          </div>
        </form>

        <div class="container1">
          <div id="status-banner" class="status-banner"></div>
        </div>

        <div class="container1">
          <div id="table_div" class="container1">
            <table class="table_2" id="current_config_table">
              <thead>
                <tr>
                  <th>CURRENT CONFIG</th>
                  <th>VALUE</th>
                </tr>
              </thead>
              <tbody id="current_config_body">
                <!-- Dados serão carregados via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      function setStatus(message, isError) {
        const banner = document.getElementById("status-banner");
        banner.textContent = message;
        banner.classList.remove("ok", "error");
        banner.classList.add(isError ? "error" : "ok");
      }

      // Função para carregar configuração atual
      function loadCurrentConfig() {
        fetch("/api/v1/prefix")
          .then((response) => response.json())
          .then((responseJson) => {
            const data = responseJson.data || {};
            document.getElementById("prefix").value = data.prefix;
          })
          .catch((error) => console.error("Error:", error));
      }

      // Função para atualizar tabela de configuração atual
      function updateCurrentConfigTable() {
        fetch("/api/v1/prefix")
          .then((response) => response.json())
          .then((responseJson) => {
            const data = responseJson.data || {};
            const tbody = document.getElementById("current_config_body");
            tbody.innerHTML = "";

            const row = tbody.insertRow();
            const cell1 = row.insertCell(0);
            const cell2 = row.insertCell(1);
            cell1.textContent = "PREFIX";
            cell2.textContent = data.prefix || "";
          })
          .catch((error) => console.error("Error:", error));
      }

      // Carregar dados ao carregar a página
      document.addEventListener("DOMContentLoaded", function () {
        loadCurrentConfig();
        updateCurrentConfigTable();
      });

      // Atualizar dados a cada 2 segundos
      setInterval(() => {
        updateCurrentConfigTable();
      }, 2000);

      // Recarregar configuração após salvar
      document
        .getElementById("prefix-config-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          try {
            const response = await fetch("/api/v1/prefix", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                prefix: document.getElementById("prefix").value,
              }),
            });

            const json = await response.json();
            if (!response.ok || json.status !== "ok") {
              throw new Error(json.message || "falha ao salvar");
            }

            setStatus("Prefixo salvo com sucesso.", false);
            updateCurrentConfigTable();
          } catch (error) {
            setStatus("Erro ao salvar prefixo: " + error, true);
          }
        });
    </script>
  </body>
</html>
