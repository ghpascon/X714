<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 WEBHOOK CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>
  <body class="eth">
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center"
        class="container1"
      >
        <form id="webhook-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th><h1>PARAMETER</h1></th>
                  <th><h1>VALUE</h1></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><label>WEBHOOK:</label></td>
                  <td>
                    <select id="webhook_on" name="webhook_on">
                      <option value="0">OFF</option>
                      <option value="1">ON</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><label>URL:</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="webhook_url"
                      id="webhook_url"
                    />
                  </td>
                </tr>

                <tr>
                  <td><label>INTERVAL (ms):</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="number"
                      min="1000"
                      step="500"
                      name="webhook_interval"
                      id="webhook_interval"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="container1">
            <button class="bt_style" type="submit">SET CONFIG</button>
          </div>
        </form>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <h1>CURRENT CONFIG</h1>
      </div>

      <div class="container1">
        <table class="table_2" id="dataTable">
          <thead>
            <tr>
              <th>PARAMETER</th>
              <th>VALUE</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>
  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function loadConfig() {
      fetch("/api/v1/webhook")
        .then((r) => r.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          document.getElementById("webhook_on").value = data.webhook_on
            ? "1"
            : "0";
          document.getElementById("webhook_url").value = data.webhook_url || "";
          document.getElementById("webhook_interval").value =
            data.webhook_interval || 10000;
        })
        .catch((e) => console.error("Error fetching webhook config:", e));
    }

    document
      .getElementById("webhook-config-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          const response = await fetch("/api/v1/webhook", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              webhook_on: document.getElementById("webhook_on").value === "1",
              webhook_url: document.getElementById("webhook_url").value.trim(),
              webhook_interval: Number(
                document.getElementById("webhook_interval").value || 10000,
              ),
            }),
          });
          const json = await response.json();
          if (!response.ok || json.status !== "ok") {
            throw new Error(json.message || "falha ao salvar");
          }
          setStatus("Configuração de webhook salva.", false);
          update_elements();
        } catch (error) {
          setStatus("Erro ao salvar webhook: " + error, true);
        }
      });

    function update_elements() {
      fetch("/api/v1/webhook")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          const tbody = document
            .getElementById("dataTable")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";

          const rows = [
            ["WEBHOOK", data.webhook_on ? "ON" : "OFF"],
            ["URL", data.webhook_url || "-"],
            ["INTERVAL", String(data.webhook_interval || 10000) + " ms"],
          ];

          rows.forEach((row) => {
            let tr = document.createElement("tr");
            row.forEach((cell) => {
              let td = document.createElement("td");
              td.textContent = cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
    loadConfig();
    update_elements();
    setInterval(update_elements, 1000);
  </script>
</html>
