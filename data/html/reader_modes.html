<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 READER MODES</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <style>
      .indicator_time_panel {
        width: 100%;
        max-width: 100%;
        border: 2px solid #d8d8d8;
        border-radius: 12px;
        padding: 14px 16px;
        box-sizing: border-box;
        margin-top: 4px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.22);
      }

      .indicator_time_title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 14px;
        color: #ffffff;
      }

      .indicator_time_controls {
        display: grid;
        grid-template-columns: 1fr minmax(150px, 240px) auto;
        align-items: center;
        gap: 12px;
      }

      .indicator_time_current {
        min-width: 0;
        font-size: 21px;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        line-height: 1.1;
      }

      .indicator_time_input {
        width: 100%;
        height: 52px;
        font-size: 22px;
        padding: 0 14px;
        box-sizing: border-box;
        color: #ffffff;
        background: #1f1f1f;
        border: 2px solid #8a8a8a;
        border-radius: 10px;
      }

      .indicator_time_input::placeholder {
        color: #d6d6d6;
      }

      .indicator_time_apply {
        min-width: 150px;
        height: 52px;
        font-size: 22px;
        font-weight: 700;
        color: #111111;
        background: #ffb41f;
        border: 2px solid #ff8c1f;
        border-radius: 10px;
        letter-spacing: 0.5px;
        cursor: pointer;
      }

      .indicator_time_apply:hover {
        background: #ffc458;
      }

      @media (max-width: 760px) {
        .indicator_time_controls {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .indicator_time_current {
          text-align: center;
        }

        .indicator_time_apply {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label style="position: relative; top: 20px" class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div id="table_div" class="container1">
        <table id="config_table">
          <thead>
            <tr>
              <th><h1>MODE</h1></th>
              <th><h1>VALUE</h1></th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                <label>START READING:</label>
              </td>
              <td>
                <button
                  id="start_reading_button"
                  onclick="setBooleanMode('start_reading', 'start_reading')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>GPI START:</label>
              </td>
              <td>
                <button
                  id="gpi_start_button"
                  onclick="setBooleanMode('gpi_start', 'gpi_start')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>ALWAYS SEND:</label>
              </td>
              <td>
                <button
                  id="always_send_button"
                  onclick="setBooleanMode('always_send', 'always_send')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>SIMPLE SEND:</label>
              </td>
              <td>
                <button
                  id="simple_send_button"
                  onclick="setBooleanMode('simple_send', 'simple_send')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>KEYBOARD:</label>
              </td>
              <td>
                <button
                  id="keyboard_button"
                  onclick="setBooleanMode('keyboard', 'keyboard')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>BUZZER:</label>
              </td>
              <td>
                <button
                  id="buzzer_button"
                  onclick="setBooleanMode('buzzer_on', 'buzzer_on')"
                ></button>
              </td>
            </tr>

            <tr>
              <td>
                <label>GTIN:</label>
              </td>
              <td>
                <button
                  id="gtin_button"
                  onclick="setBooleanMode('decode_gtin', 'decode_gtin')"
                ></button>
              </td>
            </tr>

            <tr>
              <td colspan="2">
                <div class="indicator_time_panel">
                  <div class="indicator_time_title">INDICATOR TIME (MS)</div>
                  <div class="indicator_time_controls">
                    <div class="indicator_time_current">
                      ATUAL: <span id="indicator_time_current_value">0</span>
                    </div>
                    <input
                      id="indicator_time_input"
                      class="indicator_time_input"
                      type="number"
                      min="0"
                      step="1"
                      placeholder="Novo valor"
                    />
                    <button
                      id="indicator_time_button"
                      class="indicator_time_apply"
                      onclick="saveIndicatorTime()"
                    >
                      APPLY
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <button onclick="window.location.href = '/reader'">READER</button>
      </div>
    </div>
  </body>

  <script>
    let modesState = null;

    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function modeColor(isEnabled) {
      return isEnabled ? "#22c55e" : "#ef4444";
    }

    function setButtonState(buttonId, isEnabled) {
      const button = document.getElementById(buttonId);
      button.innerText = isEnabled ? "ON" : "OFF";
      button.style.background = modeColor(isEnabled);
      button.style.borderColor = modeColor(isEnabled);
      button.disabled = false;
    }

    function renderModes() {
      if (!modesState) return;

      setButtonState("start_reading_button", modesState.start_reading);
      setButtonState("always_send_button", modesState.always_send);
      setButtonState("simple_send_button", modesState.simple_send);
      setButtonState("keyboard_button", modesState.keyboard);
      setButtonState("buzzer_button", modesState.buzzer_on);
      setButtonState("gtin_button", modesState.decode_gtin);

      const gpiButton = document.getElementById("gpi_start_button");
      if (modesState.start_reading) {
        gpiButton.innerText = "LOCKED";
        gpiButton.style.background = "#a8894f";
        gpiButton.style.borderColor = "#a8894f";
        gpiButton.disabled = true;
      } else {
        gpiButton.innerText = modesState.gpi_start ? "ON" : "OFF";
        gpiButton.style.background = modeColor(modesState.gpi_start);
        gpiButton.style.borderColor = modeColor(modesState.gpi_start);
        gpiButton.disabled = false;
      }

      const indicatorInput = document.getElementById("indicator_time_input");
      const indicatorCurrent = document.getElementById(
        "indicator_time_current_value",
      );
      indicatorCurrent.innerText = modesState.indicator_time;

      if (document.activeElement !== indicatorInput) {
        indicatorInput.value = modesState.indicator_time;
      }
    }

    async function updateMode(field, value) {
      const response = await fetch("/api/v1/reader/modes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [field]: value }),
      });

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        const message = data && data.message ? data.message : "request failed";
        throw new Error(message);
      }

      if (data && data.status !== "ok") {
        throw new Error(data.message || "request failed");
      }

      update_elements();
    }

    async function setBooleanMode(field, stateKey) {
      if (!modesState) return;

      const nextValue = modesState[stateKey] ? 0 : 1;
      try {
        await updateMode(field, !!nextValue);
      } catch (error) {
        setStatus("Falha ao atualizar modo: " + error, true);
      }
    }

    async function saveIndicatorTime() {
      const input = document.getElementById("indicator_time_input");
      const value = Number.parseInt(input.value, 10);

      if (Number.isNaN(value) || value < 0) {
        alert("Indicator time invalido");
        return;
      }

      try {
        await updateMode("indicator_time", value);
      } catch (error) {
        setStatus("Falha ao salvar indicador: " + error, true);
      }
    }

    function update_html() {
      update_elements();
    }
    update_html();
    setInterval(update_html, 1000);

    function update_elements() {
      fetch("/api/v1/reader/modes")
        .then((response) => response.json())
        .then((responseJson) => {
          modesState = responseJson.data || null;
          renderModes();
        })
        .catch((error) => console.error("Erro:", error));
    }
  </script>
</html>
