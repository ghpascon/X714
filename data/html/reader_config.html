<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X714 READER CONFIG</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
  </head>

  <body>
    <div class="container0">
      <div class="container1">
        <div class="container2">
          <label style="position: relative; top: 20px" class="SMTX">X714</label>
        </div>
        <div class="container2">
          <button onclick="window.location.href = '/'">HOME</button>
        </div>
      </div>

      <div
        style="display: flex; flex-direction: column; align-items: center"
        class="container1"
      >
        <form id="reader-config-form">
          <div id="table_div" class="container1">
            <table id="config_table">
              <thead>
                <tr>
                  <th><h1>PARAMETER</h1></th>
                  <th><h1>VALUE</h1></th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <label>SESSION:</label>
                  </td>
                  <td>
                    <select id="session" name="select_session">
                      <option value="0">0</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                    </select>
                  </td>
                </tr>

                <tr>
                  <td><label>GPI STOP DELAY (ms):</label></td>
                  <td>
                    <input
                      class="placeholder_style"
                      type="text"
                      name="gpi_stop_delay"
                      id="gpi_stop_delay"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="container1">
            <button class="bt_style" type="submit">SET CONFIG</button>
          </div>
        </form>
      </div>

      <div class="container1">
        <div id="status-banner" class="status-banner"></div>
      </div>

      <div class="container1">
        <button onclick="window.location.href = '/reader'">READER</button>
      </div>

      <div class="container1">
        <h1>CURRENT CONFIG</h1>
      </div>

      <div class="container1">
        <table class="table_2" id="dataTable">
          <thead>
            <tr>
              <th>PARAMETER</th>
              <th>VALUE</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    function setStatus(message, isError) {
      const banner = document.getElementById("status-banner");
      banner.textContent = message;
      banner.classList.remove("ok", "error");
      banner.classList.add(isError ? "error" : "ok");
    }

    function loadConfig() {
      fetch("/api/v1/reader/config")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          document.getElementById("session").value = data.session;
          document.getElementById("gpi_stop_delay").value = data.gpi_stop_delay;
        })
        .catch((error) => {
          console.error("Error fetching session data:", error);
        });
    }

    document
      .getElementById("reader-config-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          const response = await fetch("/api/v1/reader/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session: Number(document.getElementById("session").value),
              gpi_stop_delay: Number(
                document.getElementById("gpi_stop_delay").value || 0,
              ),
            }),
          });
          const json = await response.json();
          if (!response.ok || json.status !== "ok") {
            throw new Error(json.message || "falha ao salvar");
          }
          setStatus("Configuração salva com sucesso.", false);
          update_elements();
        } catch (error) {
          setStatus("Erro ao salvar configuração: " + error, true);
        }
      });

    function update_html() {
      update_elements();
    }
    loadConfig();
    update_html();
    setInterval(update_html, 1000);

    function update_elements() {
      fetch("/api/v1/reader/config")
        .then((response) => response.json())
        .then((responseJson) => {
          const data = responseJson.data || {};
          const tbody = document
            .getElementById("dataTable")
            .getElementsByTagName("tbody")[0];
          tbody.innerHTML = "";

          const rows = [
            ["SESSION", String(data.session ?? "-")],
            ["GPI STOP DELAY", String(data.gpi_stop_delay ?? "-") + " ms"],
          ];

          rows.forEach((row) => {
            let tr = document.createElement("tr");
            row.forEach((cell) => {
              let td = document.createElement("td");
              td.textContent = cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        })
        .catch((error) => console.error("Error fetching data:", error));
    }
  </script>
</html>
